{% set next_status = "open" if a.status == "resolved" else "resolved" %}
<article
  id="annotation-{{ a.id }}"
  class="annotation-card annotation-card--{{ a.kind }} absolute w-full rounded-lg border border-stone-200 bg-white p-3 text-sm shadow-sm{% if a.status == 'resolved' %} opacity-60{% endif %}"
  data-annotation-id="{{ a.id }}"
  data-kind="{{ a.kind }}"
  data-status="{{ a.status }}"
>
  <header class="mb-2 flex items-center gap-2">
    <span class="annotation-badge rounded-full bg-stone-100 px-2 py-0.5 text-xs font-medium capitalize">
      {{ a.kind }}
    </span>
    <time class="ml-auto text-xs text-stone-400">{{ a.created_at[:16] | replace("T", " ") }}</time>
    {% if not readonly %}
      <button
        type="button"
        class="rounded px-1.5 py-0.5 text-xs text-stone-500 hover:bg-stone-100"
        hx-post="/annotations/{{ a.id }}/status"
        hx-vals='{"status": "{{ next_status }}"}'
        hx-target="closest article"
        hx-swap="outerHTML"
      >
        {{ "Reopen" if a.status == "resolved" else "Resolve" }}
      </button>
      <button
        type="button"
        class="rounded px-1.5 py-0.5 text-xs text-stone-500 hover:bg-red-50 hover:text-red-700"
        hx-delete="/annotations/{{ a.id }}"
        hx-target="closest article"
        hx-swap="delete"
      >
        Delete
      </button>
    {% endif %}
  </header>

  {% if readonly %}
    <p class="whitespace-pre-wrap text-stone-700">{{ a.body }}</p>
  {% else %}
    <textarea
      name="body"
      rows="3"
      placeholder="Write a note"
      class="w-full resize-y rounded border border-stone-200 p-2 text-sm outline-none focus:border-stone-400"
      hx-put="/annotations/{{ a.id }}"
      hx-trigger="change delay:400ms"
      hx-target="closest article"
      hx-swap="outerHTML"
    >{{ a.body }}</textarea>
  {% endif %}
</article>
