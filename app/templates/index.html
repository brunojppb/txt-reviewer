{% extends "base.html" %}
{% block title %}Documents{% endblock %}
{% block body %}
<main class="mx-auto max-w-3xl px-6 py-12">
  <header class="mb-8 flex items-center justify-between gap-4">
    <h1 class="text-2xl font-semibold tracking-tight">Documents</h1>
    <a href="/passes" class="ml-auto text-sm text-stone-500 hover:underline">Editing passes</a>
    <form hx-post="/documents" hx-swap="none">
      <button
        type="submit"
        class="rounded-md bg-stone-900 px-3 py-2 text-sm font-medium text-white hover:bg-stone-700"
      >
        New document
      </button>
    </form>
  </header>

  <ul id="document-list" class="divide-y divide-stone-200 rounded-lg border border-stone-200 bg-white">
    {% for doc in documents %}
      {% include "partials/document_row.html" %}
    {% else %}
      <li class="px-4 py-8 text-center text-sm text-stone-500">No documents yet.</li>
    {% endfor %}
  </ul>
</main>
{% endblock %}
